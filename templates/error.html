{% extends "base.html" %}
{% block title %}Error {{ code }}{% endblock %}

{% block content %}
<div class="d-flex justify-content-center align-items-center" style="min-height: 60vh;">
    <div class="text-center">
        <h1 class="display-1 fw-bold text-muted">{{ code }}</h1>
        <p class="fs-4 text-muted mb-4">{{ message }}</p>
        <a href="{{ url_for('dashboard') if current_user.is_authenticated else url_for('auth.login') }}" class="btn btn-primary">
            <i class="bi bi-house"></i> Go Home
        </a>
    </div>
</div>
{% endblock %}
